name: Python validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Tests and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" basedpyright ruff

      - name: Run pytest
        run: python -m pytest

      - name: Run basedpyright
        run: basedpyright

      - name: Run Ruff
        run: ruff check .
